<text x="80" y="595" class="label muted">NORMAL</text><rect x="80" y="612" width="96" height="42" rx="8" fill="#1E3A5F"/><text x="128" y="638" text-anchor="middle" font-size="14" font-weight="700" class="white">Masuk</text><rect x="188" y="612" width="122" height="42" rx="8" fill="#14B8A6"/><text x="249" y="638" text-anchor="middle" font-size="14" font-weight="700" fill="#083344">Cari Buku</text>
