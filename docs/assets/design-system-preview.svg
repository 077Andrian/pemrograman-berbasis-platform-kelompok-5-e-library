<text x="954" y="711" class="label muted">ERROR</text><text x="954" y="738" font-size="13" font-weight="700">Email</text><rect x="954" y="749" width="366" height="42" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="968" y="775" font-size="14" fill="#172033">andrian-email</text><text x="954" y="813" font-size="12" fill="#DC2626">Format email belum benar.</text>
<text x="56" y="930" class="heading primary">Pendekatan Halaman</text><text x="1345" y="929" text-anchor="end" class="small muted">Komponen dasar tetap konsisten</text>
<rect x="56" y="953" width="630" height="176" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="80" y="978" width="52" height="52" rx="10" fill="#DBEAFE"/><text x="106" y="1012" text-anchor="middle" font-size="25" fill="#1E3A5F">⌕</text><text x="151" y="994" font-size="17" font-weight="800" class="primary">Halaman Publik</text><text x="151" y="1020" class="small muted">Penjelajahan katalog, pencarian, kategori, informasi</text><text x="151" y="1041" class="small muted">buku, dan alur masuk pengguna.</text><text x="80" y="1092" class="small muted">Palet, tipografi, dan komponen dasar mengikuti token bersama.</text>
<rect x="714" y="953" width="630" height="176" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="738" y="978" width="52" height="52" rx="10" fill="#DBEAFE"/><text x="764" y="1012" text-anchor="middle" font-size="22" fill="#1E3A5F">▦</text><text x="809" y="994" font-size="17" font-weight="800" class="primary">Halaman Admin</text><text x="809" y="1020" class="small muted">Pengelolaan buku dan rekap dengan navigasi sesuai</text><text x="809" y="1041" class="small muted">peran admin, tetap memakai token visual yang sama.</text><text x="738" y="1092" class="small muted">Izin akses tetap wajib diperiksa oleh backend.</text>
